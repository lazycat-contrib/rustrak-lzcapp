application:
  subdomain: rustrak
  background_task: true
  multi_instance: false
  public_path:
    - /
  oidc_redirect_path: /auth/sso/callback
  upstreams:
    - location: /
      backend: http://rustrak:8080/
services:
  rustrak:
    # upstream: docker.io/rustrak/rustrak-server:v0.16.4
    image: registry.lazycat.cloud/czyt/rustrak/rustrak-server:a49a4f7b90cc098f
    user: root
    environment:
      - SESSION_SECRET_KEY={{ stable_secret "session_secret" }}
      # 外部访问地址（DSN 生成与 Cookie 依赖）
      - PUBLIC_URL=https://${LAZYCAT_SUBDOMAIN}.${LAZYCAT_BOX_DOMAIN}
      # 集成懒猫 OIDC 单点登录（issuer 自动发现）
      - OIDC_ISSUER_URL=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
      - OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URL=https://${LAZYCAT_SUBDOMAIN}.${LAZYCAT_BOX_DOMAIN}/auth/sso/callback
      - OIDC_PROVIDER_NAME=LazyCat
      - OIDC_SCOPES=openid email profile
      - OIDC_AUTO_PROVISION=true
      - OIDC_LINK_EXISTING_ACCOUNTS=true
      - RUSTRAK_TELEMETRY=off
      - RUSTRAK_METRICS=off
    binds:
      - /lzcapp/var/rustrak:/data
    healthcheck:
      disable: true
